syntax = "proto3";

package transcoder.v1;

option go_package = "github.com/crimsonn/media_pipeline/pkg/pb;pb";


service TranscoderService {
  rpc TranscodeVideo (TranscodeRequest) returns (TranscodeResponse);
}

message TranscodeRequest {
  string file_id = 1;
  string source_file_path = 2;
  string output_directory = 3;
  repeated string target_resolutions = 4;
}

message TranscodeResponse {
  string file_id = 1;
  bool success = 2;
  string master_playlist_url = 3;
  double duration_seconds = 4;
  string error_message = 5;
}

