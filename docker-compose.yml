services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: media
      POSTGRES_PASSWORD: media
      POSTGRES_DB: media_pipeline
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./internal/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media -d media_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    environment:
      API_ADDR: "0.0.0.0"
      API_PORT: "8080"
      ENVIRONMENT: development
      DATABASE_URL: postgres://media:media@postgres:5432/media_pipeline?sslmode=disable
      WATCH_DIRECTORY: /data/watch
      OUTPUT_DIRECTORY: /data/done
    volumes:
      - ./watch:/data/watch
      - ./done:/data/done
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  watcher:
    build:
      context: .
      target: watcher
    environment:
      DATABASE_URL: postgres://media:media@postgres:5432/media_pipeline?sslmode=disable
      WATCH_DIRECTORY: /data/watch
      OUTPUT_DIRECTORY: /data/done
      POLLING_INTERVAL: 5s
      NUM_WORKERS: "10"
      QUEUE_CAPACITY: "100"
    volumes:
      - ./watch:/data/watch
      - ./done:/data/done
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  transcoder:
    build:
      context: .
      target: transcoder
    environment:
      DATABASE_URL: postgres://media:media@postgres:5432/media_pipeline?sslmode=disable
      TRANSCODER_WORKERS: "10"
    volumes:
      - ./watch:/data/watch
      - ./done:/data/done
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
